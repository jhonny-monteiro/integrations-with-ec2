name: Load Test
on:
  workflow_call: 
  
jobs:

  loadtest:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    
    - name: Configurando credenciais da AWS
      uses: aws-actions/configure-aws-credentials@v1
      with:
        aws-access-key-id: ${{ secrets.ID_CHAVE_ACESSO }}
        aws-secret-access-key: ${{ secrets.CHAVE_SECRETA }}
        aws-region: us-east-2
        
    - run: git clone https://github.com/jhonny-monteiro/Infra_CI

    - name: HashiCorp - Setup Terraform
      uses: hashicorp/setup-terraform@v2.0.3

    - run: terraform -chdir=Infra_CI/env/Homolog init

    - run: terraform -chdir=Infra_CI/env/Homolog destroy -auto-approve
    
    - run: terraform -chdir=Infra_CI/env/Homolog apply -auto-approve
    
    - run: echo "$(terraform -chdir=Infra_CI/env/Homolog output -raw IP_alb)"
      id: URL

    - name: Setup Python
      uses: actions/setup-python@v6.2.0
      with:
        python-version: "3.10"

    - uses: BSFishy/pip-action@v1
      with:
        packages:
          locust
    
    - run: |
        echo "from locust import HttpUser, TaskSet, task, between" >> locustfile.py
        echo "" >> locustfile.py
        echo "class UserTasks(TaskSet):" >> locustfile.py
        echo "	@task(1)" >> locustfile.py
        echo "	def index(self):" >> locustfile.py
        echo '		self.client.get("/jhonny")' >> locustfile.py
        echo "" >> locustfile.py
        echo "class WebsiteUser(HttpUser):" >> locustfile.py
        echo "	tasks = [UserTasks]" >> locustfile.py
        echo "	wait_time = between(1, 5)" >> locustfile.py

    - name: Espera ALB ficar healthy
      run: |
        URL="${{ steps.URL.outputs.stdout }}"
        echo "Aguardando ALB http://$URL/leo responder 2xx..."
        for i in $(seq 1 40); do
          if curl -sf "http://$URL/leo" > /dev/null; then
            echo "ALB healthy na tentativa $i!"
            exit 0
          fi
          echo "Tentativa $i/40 — aguardando 15s..."
          sleep 15
        done
        echo "Timeout: ALB não ficou healthy em 10 minutos"
        exit 1

    - name: Roda teste de carga
      run: locust -f locustfile.py --headless -u 10 -r 5 --run-time 60s -H http://${{ steps.URL.outputs.stdout }}

    - name: Destroy final
      if: always()
      run: terraform -chdir=Infra_CI/env/Homolog destroy -auto-approve
